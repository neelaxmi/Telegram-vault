name: Inspect built APK

on:
  push:
    branches: [protected-vault-phase1]
    paths: ['.github/workflows/inspect-apk.yml', '.github/inspect-run-id']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of an "Android build" run whose telegram-vault-debug-apk artifact should be inspected'
        required: false
        default: '43193839495'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Which run to inspect
        id: rid
        run: echo "id=${{ github.event.inputs.run_id || '' }}" >> "$GITHUB_OUTPUT"; if [ -z "${{ github.event.inputs.run_id || '' }}" ]; then echo "id=$(cat .github/inspect-run-id | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          name: telegram-vault-debug-apk
          run-id: ${{ steps.rid.outputs.id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Install build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.0.0" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
      - name: Integrity
        run: |
          cd apk; ls -l
          sha256sum app.apk
          stat -c 'size: %s bytes' app.apk
          echo "--- zip test"; unzip -tq app.apk | tail -2
          echo "--- zipalign (4-byte), and 16 KB page check for .so"
          "$BT/zipalign" -c -v 4 app.apk | tail -3 || true
          "$BT/zipalign" -c -P 16 -v 4 app.apk | grep -E "lib/.*\.so|Verification" | head -8 || true
      - name: Signature
        run: |
          cd apk
          "$BT/apksigner" verify --verbose --print-certs app.apk 2>&1 | grep -v "^WARNING: META-INF" || echo "apksigner exit code $?"
          echo "--- certificate details (jarsigner view)"
          mkdir x && cd x && unzip -q ../app.apk 'META-INF/*' && ls -l META-INF
          for f in META-INF/*.RSA META-INF/*.DSA META-INF/*.EC; do if [ -f "$f" ]; then keytool -printcert -file "$f" | head -12; fi; done
      - name: Manifest, package, SDK, ABI
        run: |
          cd apk
          "$BT/aapt2" dump badging app.apk | grep -E "^package|sdkVersion|targetSdk|native-code|application-label:|application-debuggable|uses-permission|launchable|densities" | cut -c1-200
          echo "--- ABIs in lib/"
          unzip -l app.apk | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort | uniq -c
          echo "--- dex files"; unzip -l app.apk | grep -E "classes[0-9]*\.dex"
          echo "--- compression of native libs"; unzip -v app.apk 'lib/*' | head -8
      - name: Permissions and components
        run: |
          cd apk
          echo "--- permissions"; "$BT/aapt2" dump permissions app.apk
          echo "--- requested features / exported components count"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml app.apk > ../manifest.txt
          grep -c "E: activity" ../manifest.txt | sed 's/^/activities: /'
          grep -c "E: service" ../manifest.txt | sed 's/^/services: /'
          grep -c "E: receiver" ../manifest.txt | sed 's/^/receivers: /'
          grep -E "A: android:(debuggable|allowBackup|usesCleartextTraffic|extractNativeLibs|requestLegacyExternalStorage)" ../manifest.txt | head
      - name: Search for remote-install and accessibility style risk indicators
        run: |
          cd apk
          "$BT/aapt2" dump permissions app.apk | grep -iE "REQUEST_INSTALL_PACKAGES|BIND_ACCESSIBILITY|SYSTEM_ALERT_WINDOW|READ_SMS|RECEIVE_SMS|SEND_SMS|CALL_LOG|MANAGE_EXTERNAL_STORAGE|READ_CONTACTS|BIND_DEVICE_ADMIN|PACKAGE_USAGE" || true

      - name: Raw manifest header and application attributes
        run: |
          cd apk
          "$BT/aapt2" dump badging app.apk | head -6 | cut -c1-260
          echo "--- uses-sdk element"
          grep -n -A6 "E: uses-sdk" ../manifest.txt | cut -c1-200
          echo "--- manifest root attributes"
          sed -n 1,25p ../manifest.txt | cut -c1-200
          echo "--- application attributes"
          grep -n -A40 "E: application" ../manifest.txt | grep -E "A: " | head -30 | cut -c1-200
          echo "--- sharedUserId?"; grep -c sharedUserId ../manifest.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: apk-under-test
          path: apk/app.apk
          retention-days: 3

  install-test:
    name: Install on Android emulator
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-under-test
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            echo "=== install exactly like the normal installer (no -t flag)"
            adb install -r apk/app.apk 2>&1 | tee install-plain.log || true
            adb uninstall org.telegram.messenger.beta > /dev/null 2>&1 || true
            echo "=== install allowing test-only packages (-t)"
            adb install -r -t apk/app.apk 2>&1 | tee install.log || true
            echo "--- packages"; adb shell pm list packages | grep telegram || true
            echo "--- logcat install related"; adb logcat -d | grep -iE "PackageInstaller|PackageManager|INSTALL_" | tail -20 || true
