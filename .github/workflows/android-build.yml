name: Android build (Protected Vault)

on:
  push:
    branches: [protected-vault-phase1]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABIs to build (comma separated: arm64-v8a, armeabi-v7a, x86, x86_64). Empty = all four (slow).'
        required: false
        default: 'arm64-v8a'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: Vault JVM tests (420 expected)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4   # the tests need no submodules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download JUnit
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          curl -fsSL -o "$RUNNER_TEMP/junit/junit-4.13.2.jar" https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o "$RUNNER_TEMP/junit/hamcrest-core-1.3.jar" https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Run Vault tests
        run: |
          set -o pipefail
          JUNIT_DIR="$RUNNER_TEMP/junit" bash docs/protected-vault/tools/run-vault-tests.sh | tee "$RUNNER_TEMP/jvm-tests.log"
          tail -n 3 "$RUNNER_TEMP/jvm-tests.log"
          grep -q "^OK (420 tests)" "$RUNNER_TEMP/jvm-tests.log"

  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/protected-vault-phase1' }}

      - name: Install Android SDK components
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Use own Telegram API credentials (only if the secrets are set)
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ]; then
            echo "::add-mask::$TG_API_ID"
            echo "::add-mask::$TG_API_HASH"
            f=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            python3 - "$f" <<'PY'
          import os, re, sys
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r'public static int APP_ID = \d+;', 'public static int APP_ID = %d;' % int(os.environ['TG_API_ID']), s, count=1)
          s = re.sub(r'public static String APP_HASH = "[0-9a-f]*";', 'public static String APP_HASH = "%s";' % os.environ['TG_API_HASH'], s, count=1)
          open(p, 'w').write(s)
          PY
            echo "Using API credentials from repository secrets."
          else
            echo "No TELEGRAM_API_ID / TELEGRAM_API_HASH secrets set: building with the values already in BuildVars.java."
          fi

      - name: Build debug APK
        env:
          ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "$ABIS" ]; then EXTRA="-Pandroid.injected.build.abi=$ABIS"; fi
          ./gradlew --stacktrace --no-daemon :TMessagesProj_App:assembleAfatDebug $EXTRA 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Locate APK
        id: apk
        run: |
          apk=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$apk"
          ls -l "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-vault-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
